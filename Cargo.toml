[package]
name = "tranal-despertador"
version = "0.4.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
# egui para a interface imediata; egui-winit para integração com winit;
# softbuffer para exibir pixels na janela sem GPU. Renderização 100% software:
# sem OpenGL, sem wgpu, sem driver de vídeo — custa ~15 MB em vez de 140+.
egui = { version = "0.37", default-features = false, features = ["color-hex"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
softbuffer = "0.4"
# Uma via só de decodificação para WAV, MP3, FLAC e OGG. A feature "pcm" é
# obrigatória: sem ela o decodificador de WAV PCM nem é registrado e o arquivo
# falha com "unsupported audio codec".
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "flac", "ogg", "pcm"] }
tray-icon = "0.26.1"
ureq = "2.12"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
winreg = "0.56.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
