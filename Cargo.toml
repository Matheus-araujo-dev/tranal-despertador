[package]
name = "tranal-despertador"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
# eframe sem o backend wgpu: usamos o renderizador glow (OpenGL), que usa bem
# menos memoria e fica em 0% de CPU parado. O wgpu/DX12 chegava a 364 MB e
# 99% de um core com a janela aberta.
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
] }
egui = { version = "0.37", features = ["default"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Uma via só de decodificação para WAV, MP3, FLAC e OGG. A feature "pcm" é
# obrigatória: sem ela o decodificador de WAV PCM nem é registrado e o arquivo
# falha com "unsupported audio codec".
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "flac", "ogg", "pcm"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
winreg = "0.56.0"
